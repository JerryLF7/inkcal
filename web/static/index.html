<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>inkcal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f; color: #e0e0e0; min-height: 100vh;
  }
  .app-layout { max-width: 480px; margin: 0 auto; padding: 16px; }

  /* Header */
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  h1 span { color: #888; font-size: 14px; font-weight: 400; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 16px; }

  /* Date nav */
  .date-nav .nav-btn {
    background: none; border: none; color: #888; font-size: 20px;
    cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  .date-nav .nav-btn:active { background: #333; }
  .date-nav .date-label {
    font-size: 15px; font-weight: 600; color: #e0e0e0; cursor: pointer;
    user-select: none; padding: 4px 8px; border-radius: 8px;
  }
  .date-nav .date-label:active { background: #2a2a2a; }
  .date-label-wrap {
    display: inline-flex; align-items: center; gap: 2px;
  }
  .refresh-btn { font-size: 16px; padding: 4px 6px; color: #888; }
  .refresh-btn:active { color: #2a6eff; }

  /* Calendar dropdown */
  .calendar-dropdown {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    background: #1e1e1e; border: 1px solid #333; border-radius: 12px;
    padding: 12px; z-index: 10; min-width: 288px; margin-top: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .cal-month { font-size: 14px; font-weight: 600; color: #e0e0e0; }
  .cal-nav {
    background: none; border: none; color: #aaa; font-size: 18px;
    cursor: pointer; padding: 4px 10px; border-radius: 6px; line-height: 1;
  }
  .cal-nav:active { background: #333; }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    text-align: center; font-size: 11px; color: #666; margin-bottom: 4px; padding: 4px 0;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 3px; text-align: center;
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 13px; border-radius: 8px; cursor: pointer; color: #ccc;
    position: relative;
  }
  .cal-day:hover { background: #2a2a2a; }
  .cal-day.other { color: #444; pointer-events: none; }
  .cal-day.today { color: #2a6eff; font-weight: 700; }
  .cal-day.selected { background: #2a6eff; color: #fff; }
  .cal-day.selected.today { color: #fff; }
  .cal-day.has-data:not(.selected)::after {
    content: ''; position: absolute; bottom: 3px; left: 50%;
    transform: translateX(-50%); width: 4px; height: 4px;
    border-radius: 50%; background: #51cf66;
  }
  .cal-day.selected.has-data::after {
    content: ''; position: absolute; bottom: 3px; left: 50%;
    transform: translateX(-50%); width: 4px; height: 4px;
    border-radius: 50%; background: rgba(255,255,255,0.6);
  }

  /* Quick links */
  .quick-links { display: flex; gap: 8px; margin-bottom: 16px; }
  .quick-links button {
    flex: 1; background: #1a1a1a; color: #aaa; border: 1px solid #2a2a2a;
    border-radius: 10px; padding: 8px 0; font-size: 13px; cursor: pointer;
  }
  .quick-links button.active { background: #2a6eff22; color: #2a6eff; border-color: #2a6eff; }
  .quick-links button:active { background: #2a2a2a; }

  /* Summary bar */
  .summary {
    background: #1a1a1a; border: 1px solid #222;
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px;
  }
  .summary .stat { text-align: center; }
  .summary .stat .val { font-size: 20px; font-weight: 700; }
  .summary .stat .val.cal { color: #e8e8e8; }
  .summary .stat .val.cal.over { color: #ff6b6b; }
  .summary .stat .val.protein { color: #51cf66; }
  .summary .stat .val.carbs { color: #ffd43b; }
  .summary .stat .val.fat { color: #9775fa; }
  .summary .stat .label { font-size: 11px; color: #888; margin-top: 2px; }
  .progress {
    height: 4px; background: #2a2a2a; border-radius: 2px;
    margin-top: 6px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; background: #2a6eff;
    border-radius: 2px; transition: width .3s ease;
  }
  .progress-fill.over { background: #ff6b6b; }

  /* Meal cards */
  .meal-card {
    background: #1a1a1a; border-radius: 12px; padding: 14px 16px;
    margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px;
  }
  .meal-card .conf-indicator {
    width: 4px; height: 100%; min-height: 48px; border-radius: 2px; flex-shrink: 0;
  }
  .meal-card .conf-high { background: #51cf66; }
  .meal-card .conf-medium { background: #ffd43b; }
  .meal-card .conf-low { background: #ff6b6b; }
  .meal-card .body { flex: 1; min-width: 0; }
  .meal-card .meal-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .meal-card .meal-meta { font-size: 12px; color: #999; }
  .meal-card .meal-meta .source { color: #666; }
  .meal-card .meal-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    flex-shrink: 0;
    gap: 4px;
  }
  .meal-card .meal-cals {
    text-align: right; font-size: 18px; font-weight: 700; color: #e8e8e8;
  }
  .meal-card .meal-cals small {
    font-size: 12px; font-weight: 400; color: #888;
  }

  /* Macros inline */
  .macros { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; }
  .macros span { color: #999; }
  .macros .p { color: #51cf66; }
  .macros .c { color: #ffd43b; }
  .macros .f { color: #9775fa; }

  /* Empty state */
  .empty {
    text-align: center; padding: 48px 16px; color: #555;
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }
  .empty-hint { font-size: 12px !important; color: #555; margin-top: 6px; }
  .empty-cta {
    margin-top: 16px; background: #2a6eff; color: #fff; border: none;
    border-radius: 10px; padding: 8px 18px; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .empty-cta:active { background: #1a5aee; }

  /* Multi-day / week view */
  .day-group { margin-bottom: 16px; }
  .day-group .day-header {
    font-size: 13px; color: #999; margin-bottom: 8px; padding-left: 4px;
  }
  .day-group .day-header .day-total { color: #e8e8e8; font-weight: 600; float: right; }

  /* Week chart (dependency-free SVG) */
  .week-chart {
    background: #1a1a1a; border: 1px solid #222; border-radius: 12px;
    padding: 14px 14px 10px; margin-bottom: 16px;
  }
  .week-chart .wc-title { font-size: 12px; color: #888; margin-bottom: 8px; }
  .week-chart svg { display: block; width: 100%; height: 150px; }
  .wc-bar { fill: #2a6eff; }
  .wc-bar.over { fill: #ff6b6b; }
  .wc-target { stroke: #555; stroke-width: 1; stroke-dasharray: 5 5; }
  .wc-axis { fill: #888; font-size: 10px; text-anchor: middle; }
  .wc-val { fill: #999; font-size: 10px; text-anchor: middle; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 32px;
    transform: translateX(-50%) translateY(16px);
    background: #2a2a2a; color: #e0e0e0;
    border: 1px solid #3a3a3a; border-radius: 10px;
    padding: 10px 18px; font-size: 14px;
    opacity: 0; transition: opacity .2s, transform .2s;
    z-index: 300; pointer-events: none;
    max-width: 82%; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { border-color: #ff6b6b55; color: #ff9b9b; }

  /* Delete two-step confirm */
  .lbl-btn.armed { background: #ff6b6b; color: #fff; border-color: #ff6b6b; }

  /* Loading */
  .loading { text-align: center; padding: 32px; color: #555; }
  .spinner {
    width: 24px; height: 24px; border: 3px solid #2a2a2a;
    border-top-color: #2a6eff; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .refresh-btn.spinning { animation: spin 0.8s linear infinite; pointer-events: none; }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.95);
    z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .lightbox img {
    max-width: 100%; max-height: 55vh; object-fit: contain;
    border-radius: 4px;
  }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px;
    color: #aaa; font-size: 24px; cursor: pointer;
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  }
  .lightbox-meta {
    margin-top: 14px; text-align: center; padding: 0 24px;
  }
  .lb-meal { font-size: 17px; font-weight: 600; color: #e8e8e8; }
  .lb-stats {
    display: flex; align-items: baseline; justify-content: center;
    gap: 14px; margin-top: 6px; font-size: 13px;
  }
  .lb-cal { font-size: 20px; font-weight: 700; color: #e8e8e8; }
  .lb-cal small { font-size: 12px; font-weight: 400; color: #888; }
  .lb-stats .p { color: #51cf66; }
  .lb-stats .c { color: #ffd43b; }
  .lb-stats .f { color: #9775fa; }
  .lb-sub { margin-top: 6px; font-size: 12px; color: #888; }
  .lightbox-labels {
    display: flex; gap: 8px; margin-top: 12px;
  }
  .lbl-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: #2a2a2a; color: #888; border: 1px solid #333;
    border-radius: 6px; padding: 6px 14px; cursor: pointer;
    font-size: 13px; font-family: inherit; line-height: 1;
  }
  .lbl-btn:active { background: #3a3a3a; }
  .lbl-btn.upload { padding: 6px 10px; }

  .lightbox-reanalysis {
    margin-top: 12px;
    width: 100%;
    max-width: 400px;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .lightbox-reanalysis.active {
    display: flex;
  }
  .reanalysis-textarea {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: #e0e0e0;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
    outline: none;
  }
  .reanalysis-textarea:focus {
    border-color: #2a6eff;
  }
  .reanalysis-textarea:disabled {
    opacity: 0.5;
  }
  .reanalysis-submit {
    background: #2a6eff;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    align-self: flex-end;
  }
  .reanalysis-submit:disabled {
    background: #555;
    cursor: not-allowed;
  }
  .reanalysis-error {
    color: #ff6b6b;
    font-size: 12px;
    text-align: center;
  }
  .reanalysis-hint {
    color: #666;
    font-size: 11px;
    text-align: right;
  }
  .reanalysis-spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }

  .meal-card.has-image { cursor: pointer; }
  .meal-card.has-image:active { background: #222; }

  /* Card thumbnail */
  .card-thumb {
    width: 48px; height: 48px; border-radius: 8px; object-fit: cover;
    flex-shrink: 0; cursor: pointer; background: #2a2a2a;
  }
  .card-thumb:active { opacity: 0.7; }

  /* Upload button */
  .app-header {
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .date-nav-wrapper { position: relative; }
  .date-nav {
    display: flex; align-items: center; justify-content: space-between;
    background: #1a1a1a; border-radius: 12px; padding: 8px 12px; margin-bottom: 12px;
  }
  .upload-btn {
    background: #2a6eff; color: #fff; border: none;
    border-radius: 10px; padding: 8px 14px; font-size: 14px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .upload-btn:active { background: #1a5aee; }
  .upload-btn:disabled { background: #555; cursor: not-allowed; }

  /* Upload overlay */
  .upload-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 200; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #e0e0e0;
  }
  .upload-overlay .msg { margin-top: 16px; font-size: 16px; }
  .upload-overlay .detail { margin-top: 8px; font-size: 13px; color: #888; }

  /* Upload picker modal */
  .upload-picker {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 190; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .upload-picker-box {
    background: #1e1e1e; border-radius: 16px; padding: 24px;
    width: 90%; max-width: 380px; text-align: center;
  }
  .upload-picker-box h2 {
    font-size: 17px; font-weight: 600; margin-bottom: 16px; color: #e0e0e0;
  }
  .drop-zone {
    border: 2px dashed #444; border-radius: 14px;
    padding: 40px 20px; cursor: pointer; transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: #2a6eff; background: rgba(42,110,255,0.08);
  }
  .drop-zone .dz-icon { font-size: 40px; margin-bottom: 10px; }
  .drop-zone .dz-title { font-size: 15px; color: #ccc; margin-bottom: 4px; }
  .drop-zone .dz-hint { font-size: 12px; color: #666; }
  .drop-zone .dz-hint kbd {
    background: #333; color: #aaa; border-radius: 4px;
    padding: 1px 6px; font-size: 11px; font-family: inherit;
  }
  .upload-picker-cancel {
    background: none; border: none; color: #888; font-size: 14px;
    cursor: pointer; margin-top: 12px; font-family: inherit;
  }
  .upload-picker-cancel:hover { color: #aaa; }

  /* Date picker (inside date-picker modal) */
  .dp-input {
    width: 100%; background: #222; border: 1px solid #444;
    border-radius: 8px; padding: 10px 14px; font-size: 15px;
    color: #e0e0e0; outline: none; font-family: inherit;
    margin-top: 12px; color-scheme: dark;
  }
  .dp-input:focus { border-color: #2a6eff; }
  .dp-filename { font-size: 13px; color: #666; margin-top: 4px; word-break: break-all; }
  .dp-btns {
    display: flex; gap: 8px; margin-top: 20px;
  }
  .dp-btns .upload-picker-cancel {
    margin-top: 0; flex: 1; padding: 10px; border: 1px solid #333;
    border-radius: 8px; font-size: 14px;
  }
  .dp-confirm {
    flex: 1; background: #2a6eff; color: #fff; border: none;
    border-radius: 8px; padding: 10px; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }
  .dp-confirm:hover { background: #3a7eff; }
  .dp-confirm:active { background: #1a5aee; }

  /* Photo picker modal */
  .photo-picker-box { max-width: 520px; }
  .album-scroll {
    max-height: 55vh;
    overflow-y: auto;
    margin: 16px 0;
    -webkit-overflow-scrolling: touch;
  }
  .album-date-group { margin-bottom: 16px; }
  .album-date-label {
    font-size: 13px; font-weight: 600; color: #aaa;
    margin-bottom: 8px; text-align: left;
    position: sticky; top: 0; background: #1e1e1e; padding: 4px 0;
    z-index: 1;
  }
  .album-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .album-grid-empty {
    color: #888; font-size: 14px; padding: 32px 0;
    text-align: center;
  }
  .album-thumb {
    aspect-ratio: 1; object-fit: cover; border-radius: 8px;
    cursor: pointer; width: 100%; background: #2a2a2a;
  }
  .album-thumb:hover { opacity: 0.85; }
  .album-loading-more {
    display: flex; justify-content: center; padding: 12px 0;
  }
  .local-upload-btn {
    background: #2a6eff; color: #fff; border: none;
    border-radius: 10px; padding: 8px 14px; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }
  .local-upload-btn:hover { background: #3a7eff; }
  .photo-picker-actions {
    display: flex; gap: 8px; justify-content: center;
  }

  /* ── Desktop layout (>=768px) ──────────────────────────────── */
  @media (min-width: 768px) {
    .app-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto auto auto 1fr;
      grid-template-areas:
        "header   datenav"
        "links    summary"
        "cal      content"
        ".        content";
      gap: 20px 24px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      align-items: start;
    }

    .app-header {
      grid-area: header;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 16px;
      border-bottom: 1px solid #222;
    }
    .upload-btn { width: 100%; }

    .quick-links {
      grid-area: links;
      flex-direction: column;
      gap: 6px;
    }
    .quick-links button { text-align: left; padding-left: 14px; }

    .date-nav-wrapper {
      display: contents;
      position: static;
    }
    .date-nav {
      grid-area: datenav;
      margin-bottom: 0;
    }

    .calendar-dropdown {
      grid-area: cal;
      position: static !important;
      transform: none !important;
      display: block !important;
      box-shadow: none;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 10px;
      margin: 0;
      min-width: unset;
      background: #1a1a1a;
      left: auto;
      top: auto;
      z-index: auto;
    }
    .cal-nav { font-size: 20px; padding: 4px 12px; }
    .cal-month { font-size: 15px; }
    .cal-day { font-size: 14px; }

    .summary {
      grid-area: summary;
      padding: 20px;
    }

    #content {
      grid-area: content;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    #content > .meal-card { margin-bottom: 0; }
    #content > .empty { grid-column: 1 / -1; }
    #content > .loading { grid-column: 1 / -1; }
    #content > .week-chart { grid-column: 1 / -1; }

    /* Week view within desktop */
    #content > .day-group {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .day-group > .day-header { grid-column: 1 / -1; }
    .day-group > .meal-card { margin-bottom: 0; }
  }
</style>
</head>
<body>
<div class="app-layout">
  <div class="app-header">
    <div>
      <h1>inkcal <span>🍽️</span></h1>
      <div class="subtitle">食物热量追踪</div>
    </div>
    <button class="upload-btn" id="upload-btn" onclick="triggerPhotoPicker()">📷 选择照片</button>
  </div>

  <div class="quick-links">
    <button onclick="loadDay('today')" id="q-today">今日</button>
    <button onclick="loadDay('yesterday')" id="q-yesterday">昨日</button>
    <button onclick="loadWeek()" id="q-week">本周</button>
  </div>


  <div class="date-nav-wrapper">
    <div class="date-nav">
      <button class="nav-btn" onclick="prevPeriod()">‹</button>
      <span class="date-label-wrap"><span class="date-label" id="date-label" onclick="toggleCalendar()"></span><button class="nav-btn refresh-btn" id="refresh-btn" onclick="refreshPeriod()" title="刷新">↻</button></span>
      <button class="nav-btn" onclick="nextPeriod()">›</button>
    </div>
    <div class="calendar-dropdown" id="calendar-dropdown" style="display:none">
      <div class="cal-header">
        <button class="cal-nav" onclick="event.stopPropagation();changeMonth(-1)">‹</button>
        <span class="cal-month" id="cal-month"></span>
        <button class="cal-nav" onclick="event.stopPropagation();changeMonth(1)">›</button>
      </div>
      <div class="cal-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>

  <div id="summary-bar" class="summary" style="display:none">
    <div class="stat">
      <div class="val cal" id="s-cal">0</div>
      <div class="label">/ <span id="s-target">2500</span> kcal</div>
      <div class="progress"><div class="progress-fill" id="s-cal-bar"></div></div>
    </div>
    <div class="stat"><div class="val protein" id="s-protein">0</div><div class="label">蛋白(g)</div></div>
    <div class="stat"><div class="val carbs" id="s-carbs">0</div><div class="label">碳水(g)</div></div>
    <div class="stat"><div class="val fat" id="s-fat">0</div><div class="label">脂肪(g)</div></div>
  </div>

  <div id="content"><div class="loading"><div class="spinner"></div>加载中...</div></div>
</div>

<script>
const CACHE_PREFIX = 'inkcal:';
const DAILY_TARGET_KCAL = 2500;

function cacheGet(key) {
  try { const item = localStorage.getItem(CACHE_PREFIX + key); return item ? JSON.parse(item) : null; }
  catch { return null; }
}
function cacheSet(key, data) {
  try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(data)); } catch {}
}
function cacheDel(key) {
  try { localStorage.removeItem(CACHE_PREFIX + key); } catch {}
}

const API = '';
let currentDate = new Date();
let currentLoadedDate = '';
let currentLightboxAssetId = '';
let viewMode = 'day'; // 'day' | 'week'
let currentWeekMonday = null;
let availableDates = new Set();
let calendarYear, calendarMonth;
let _loadSeq = 0;
let _fetchId = 0;
let _abortController = null;
let _toastTimer = null;

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type === 'error' ? ' error' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, 2600);
}

function apiFetch(path, timeoutMs = 10000) {
  if (_abortController) _abortController.abort();
  _abortController = new AbortController();
  const url = `${API}${path}`;
  const fetchId = ++_fetchId;

  function _doFetch(signal) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => signal.abort(), timeoutMs);
      fetch(url, { signal })
        .then(r => { clearTimeout(timer); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .then(resolve)
        .catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  return _doFetch(_abortController.signal).catch(err => {
    if (err.name === 'AbortError' && fetchId === _fetchId) {
      // Retry once with a local controller (don't interfere with global _abortController)
      const ctrl = new AbortController();
      return _doFetch(ctrl.signal);
    }
    throw err;
  });
}

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function parseDate(s) { const [y,m,d]=s.split('-'); return new Date(+y,+m-1,+d); }
function displayDate(ds) {
  const d = parseDate(ds);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}年${mm}月${dd}日`;
}

function hktNow() {
  const now = new Date();
  return new Date(now.toLocaleString('en-US', {timeZone:'Asia/Hong_Kong'}));
}

function mondayOf(d) {
  const m = new Date(d);
  m.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return m;
}

const SOURCE_LABELS = { manual: '手动', immich: 'Immich', photoprism: 'PhotoPrism' };
const CONF_LABELS = { high: '高', medium: '中', low: '低' };
const CONF_TITLES = { high: '置信度：高', medium: '置信度：中', low: '置信度：低' };

// ── EXIF date reader ──────────────────────────────────────────
// Supports JPEG (APP1/Exif), PNG (eXIf chunk), WebP (EXIF chunk).
// HEIC falls back to server-side extraction via the date picker.

function extractJpegExif(arr) {
  // Scan for APP1 marker (0xFFE1) containing "Exif\0\0"
  const dv = new DataView(arr.buffer, arr.byteOffset, arr.byteLength);
  const maxScan = Math.min(arr.length, 65536);
  for (let i = 2; i < maxScan - 10; i++) {
    if (dv.getUint16(i) !== 0xFFE1) continue;
    const segLen = dv.getUint16(i + 2);
    if (i + 2 + segLen > arr.length) continue;
    const sig = String.fromCharCode(arr[i+4], arr[i+5], arr[i+6], arr[i+7], arr[i+8], arr[i+9]);
    if (sig !== 'Exif\0\0') continue;
    // Return TIFF data (after "Exif\0\0" header)
    const tiffStart = i + 10;
    const tiffLen = segLen - 8;
    return arr.slice(tiffStart, tiffStart + tiffLen);
  }
  return null;
}

function extractPngExif(arr) {
  // PNG: 8-byte signature, then chunks: [4B len][4B type][data][4B CRC]
  let offset = 8;
  while (offset + 12 <= arr.length) {
    const dv = new DataView(arr.buffer, arr.byteOffset + offset, 8);
    const len = dv.getUint32(0);
    const type = String.fromCharCode(arr[offset+4], arr[offset+5], arr[offset+6], arr[offset+7]);
    if (type === 'eXIf') {
      return arr.slice(offset + 8, offset + 8 + len);
    }
    if (type === 'IEND') break;
    offset += 12 + len;
  }
  return null;
}

function extractWebpExif(arr) {
  // RIFF: 'RIFF'[4B size]'WEBP', then chunks: [4B type][4B size][data]
  if (arr.length < 20) return null;
  const type = String.fromCharCode(arr[8], arr[9], arr[10], arr[11]);
  if (type !== 'WEBP') return null;
  let offset = 12;
  while (offset + 8 <= arr.length) {
    const dv = new DataView(arr.buffer, arr.byteOffset + offset, 8);
    const ckType = String.fromCharCode(arr[offset], arr[offset+1], arr[offset+2], arr[offset+3]);
    const ckSize = dv.getUint32(4, true);
    if (ckType === 'EXIF') {
      return arr.slice(offset + 8, offset + 8 + ckSize);
    }
    offset += 8 + ckSize + (ckSize & 1); // chunks are padded to even
  }
  return null;
}

function parseTiffDate(tiffBytes) {
  // Parse TIFF header + IFD0 to find DateTimeOriginal (0x9003)
  const dv = new DataView(tiffBytes.buffer, tiffBytes.byteOffset, tiffBytes.byteLength);
  if (tiffBytes.length < 8) return null;

  const le = dv.getUint16(0) === 0x4949;  // II = little-endian
  if (dv.getUint16(2, le) !== 0x002A) return null;

  const ifd0Off = dv.getUint32(4, le);
  if (ifd0Off + 2 > tiffBytes.length) return null;

  const numEntries = dv.getUint16(ifd0Off, le);

  for (let j = 0; j < numEntries; j++) {
    const entryOff = ifd0Off + 2 + j * 12;
    if (entryOff + 12 > tiffBytes.length) break;

    const tag = dv.getUint16(entryOff, le);
    if (tag !== 0x9003) continue;  // DateTimeOriginal

    const type = dv.getUint16(entryOff + 2, le);
    const count = dv.getUint32(entryOff + 4, le);
    if (type !== 2) continue;  // Must be ASCII

    let dateBytes;
    if (count <= 4) {
      dateBytes = tiffBytes.slice(entryOff + 8, entryOff + 8 + count);
    } else {
      const valueOff = dv.getUint32(entryOff + 8, le);
      dateBytes = tiffBytes.slice(valueOff, valueOff + count);
    }

    return new TextDecoder('ascii').decode(dateBytes).replace(/\0/g, '').trim();
  }
  return null;
}

function readExifDate(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const arr = new Uint8Array(e.target.result);
        if (arr.length < 8) { resolve(null); return; }

        let exifBytes = null;

        // JPEG: starts with 0xFFD8
        if (arr[0] === 0xFF && arr[1] === 0xD8) {
          exifBytes = extractJpegExif(arr);
        }
        // PNG: starts with \x89PNG
        else if (arr[0] === 0x89 && arr[1] === 0x50 && arr[2] === 0x4E && arr[3] === 0x47) {
          exifBytes = extractPngExif(arr);
        }
        // WebP: RIFF container
        else if (arr[0] === 0x52 && arr[1] === 0x49 && arr[2] === 0x46 && arr[3] === 0x46) {
          exifBytes = extractWebpExif(arr);
        }
        // HEIC and others: not parsed client-side

        if (exifBytes) {
          const raw = parseTiffDate(exifBytes);
          if (raw && raw.length >= 10) {
            resolve(raw.slice(0, 10).replace(/:/g, '-'));
            return;
          }
        }
        resolve(null);
      } catch {
        resolve(null);
      }
    };
    reader.onerror = () => resolve(null);
    reader.readAsArrayBuffer(file.slice(0, 131072));  // First 128KB is enough for EXIF
  });
}

// ── Calendar ──────────────────────────────────────────────────

function toggleCalendar() {
  if (window.innerWidth >= 768) return;
  const dd = document.getElementById('calendar-dropdown');
  if (dd.style.display === 'none') {
    calendarYear = currentDate.getFullYear();
    calendarMonth = currentDate.getMonth();
    renderCalendar(calendarYear, calendarMonth);
    dd.style.display = 'block';
  } else {
    dd.style.display = 'none';
  }
}

function changeMonth(delta) {
  calendarMonth += delta;
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  renderCalendar(calendarYear, calendarMonth);
}

function renderCalendar(y, m) {
  document.getElementById('cal-month').textContent = `${y}年${String(m+1).padStart(2,'0')}月`;
  const grid = document.getElementById('cal-grid');
  const firstDay = (new Date(y, m, 1).getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = fmtDate(hktNow());
  const selected = fmtDate(currentDate);

  let html = '';
  for (let i = 0; i < firstDay; i++) {
    html += '<span class="cal-day other"></span>';
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls = 'cal-day';
    if (ds === today) cls += ' today';
    if (ds === selected) cls += ' selected';
    if (availableDates.has(ds)) cls += ' has-data';
    html += `<span class="${cls}" onclick="event.stopPropagation();loadDay('${ds}');toggleCalendar()">${d}</span>`;
  }
  grid.innerHTML = html;
}

// Close calendar when clicking outside
document.addEventListener('click', function(e) {
  if (window.innerWidth >= 768) return;
  const dd = document.getElementById('calendar-dropdown');
  const label = document.getElementById('date-label');
  if (dd && dd.style.display === 'block' && !dd.contains(e.target) && e.target !== label) {
    dd.style.display = 'none';
  }
});

// ── Data loading ──────────────────────────────────────────────

function loadDay(dateKey) {
  viewMode = 'day';
  document.querySelectorAll('.quick-links button').forEach(b => b.classList.remove('active'));

  let ds;
  if (dateKey === 'today') {
    const now = hktNow();
    ds = fmtDate(now);
    currentDate = now;
    document.getElementById('q-today').classList.add('active');
  } else if (dateKey === 'yesterday') {
    const d = hktNow(); d.setDate(d.getDate()-1);
    ds = fmtDate(d);
    currentDate = d;
    document.getElementById('q-yesterday').classList.add('active');
  } else {
    ds = dateKey;
    currentDate = parseDate(ds);
  }

  document.getElementById('date-label').textContent = displayDate(ds);
  const seq = ++_loadSeq;

  const cached = cacheGet('day:' + ds);
  if (cached) {
    renderDay(cached);
  } else {
    document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
  }

  apiFetch(`/api/records?date=${ds}`)
    .then(data => {
      if (seq !== _loadSeq) return;
      cacheSet('day:' + ds, data);
      renderDay(data);
      if (window.innerWidth >= 768) {
        calendarYear = currentDate.getFullYear();
        calendarMonth = currentDate.getMonth();
        renderCalendar(calendarYear, calendarMonth);
      }
    })
    .catch(() => {
      if (seq !== _loadSeq) return;
      if (!cacheGet('day:' + ds)) showError();
    });
}

function prevDay() {
  const d = new Date(currentDate);
  d.setDate(d.getDate()-1);
  loadDay(fmtDate(d));
}

function nextDay() {
  const d = new Date(currentDate);
  d.setDate(d.getDate()+1);
  const tomorrow = hktNow(); tomorrow.setDate(tomorrow.getDate()+1);
  if (d > tomorrow) return;
  loadDay(fmtDate(d));
}

function shiftWeek(delta) {
  if (!currentWeekMonday) return;
  const m = new Date(currentWeekMonday);
  m.setDate(m.getDate() + delta * 7);
  const cur = mondayOf(hktNow());
  if (m > cur) return; // no future weeks
  loadWeek(m);
}

function prevPeriod() {
  if (viewMode === 'week') shiftWeek(-1); else prevDay();
}

function nextPeriod() {
  if (viewMode === 'week') shiftWeek(1); else nextDay();
}

function refreshPeriod() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');

  if (viewMode === 'week' && currentWeekMonday) {
    const weekKey = fmtDate(currentWeekMonday);
    cacheDel('week:' + weekKey);
    fetch(`${API}/api/week?start=${weekKey}`)
      .then(r => r.json())
      .then(data => {
        cacheSet('week:' + weekKey, data);
        renderWeek(data);
      })
      .catch(() => {})
      .finally(() => btn.classList.remove('spinning'));
    return;
  }

  const ds = currentLoadedDate;
  if (!ds) { btn.classList.remove('spinning'); return; }
  cacheDel('day:' + ds);
  fetch(`${API}/api/records?date=${ds}`)
    .then(r => r.json())
    .then(data => {
      cacheSet('day:' + ds, data);
      renderDay(data);
    })
    .catch(() => {})
    .finally(() => btn.classList.remove('spinning'));
}

function loadWeek(monday) {
  viewMode = 'week';
  document.querySelectorAll('.quick-links button').forEach(b => b.classList.remove('active'));
  document.getElementById('q-week').classList.add('active');

  const seq = ++_loadSeq;

  currentWeekMonday = monday || mondayOf(hktNow());
  const weekKey = fmtDate(currentWeekMonday);

  const cached = cacheGet('week:' + weekKey);
  if (cached) {
    renderWeek(cached);
  } else {
    document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
  }

  apiFetch(`/api/week?start=${weekKey}`)
    .then(data => {
      if (seq !== _loadSeq) return;
      cacheSet('week:' + weekKey, data);
      renderWeek(data);
      if (window.innerWidth >= 768) {
        calendarYear = currentDate.getFullYear();
        calendarMonth = currentDate.getMonth();
        renderCalendar(calendarYear, calendarMonth);
      }
    })
    .catch(() => {
      if (seq !== _loadSeq) return;
      if (!cacheGet('week:' + weekKey)) showError();
    });
}

function updateSummaryBar(summary, targetKcal) {
  document.getElementById('summary-bar').style.display = 'grid';
  const sCal = document.getElementById('s-cal');
  sCal.textContent = summary.calories;
  sCal.classList.toggle('over', summary.calories > targetKcal);
  document.getElementById('s-target').textContent = targetKcal;
  document.getElementById('s-protein').textContent = summary.protein;
  document.getElementById('s-carbs').textContent = summary.carbs;
  document.getElementById('s-fat').textContent = summary.fat;
  const bar = document.getElementById('s-cal-bar');
  bar.style.width = Math.min(summary.calories / targetKcal * 100, 100) + '%';
  bar.classList.toggle('over', summary.calories > targetKcal);
}

function renderDay(data) {
  const { date: ds, records, summary } = data;
  currentLoadedDate = ds;
  document.getElementById('date-label').textContent = displayDate(ds);
  updateSummaryBar(summary, DAILY_TARGET_KCAL);

  const el = document.getElementById('content');
  if (!records.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🍽️</div><p>暂无记录</p><p class="empty-hint">拍照后会自动同步，也可以手动选择照片</p><button class="empty-cta" onclick="triggerPhotoPicker()">📷 选择照片</button></div>`;
    _pendingLightboxAsset = '';
    return;
  }

  el.innerHTML = records.map(r => mealCard(r)).join('');

  if (_pendingLightboxAsset) {
    const aid = _pendingLightboxAsset;
    _pendingLightboxAsset = '';
    setTimeout(() => openLightboxForRecord(aid), 100);
  }
}

function renderWeek(data) {
  const startD = parseDate(data.start);
  const endD = parseDate(data.end);
  document.getElementById('date-label').textContent =
    `${startD.getMonth()+1}月${startD.getDate()}日 – ${endD.getMonth()+1}月${endD.getDate()}日`;
  updateSummaryBar(data.summary, DAILY_TARGET_KCAL * 7);

  const el = document.getElementById('content');
  const days = Object.entries(data.by_day).filter(([_, d]) => d.records.length > 0);

  let html = '<div class="week-chart" id="week-chart-wrap"></div>';
  if (!days.length) {
    html += '<div class="empty"><div class="icon">📅</div><p>本周暂无记录</p></div>';
  } else {
    html += days.map(([ds, day]) => `
      <div class="day-group">
        <div class="day-header">
          ${ds} <span class="day-total">${day.summary.calories} kcal</span>
        </div>
        ${day.records.map(r => mealCard(r)).join('')}
      </div>
    `).join('');
  }
  el.innerHTML = html;
  renderWeekChart(data.by_day);
}

function renderWeekChart(byDay) {
  const wrap = document.getElementById('week-chart-wrap');
  if (!wrap) return;

  const dates = Object.keys(byDay).sort();
  if (!dates.length) { wrap.style.display = 'none'; return; }

  const vals = dates.map(d => byDay[d].summary.calories);
  const w = Math.max(wrap.clientWidth - 28, 260);
  const h = 150, padB = 20, padT = 18;
  const max = Math.max(DAILY_TARGET_KCAL * 1.15, ...vals, 1);
  const slot = w / dates.length;
  const barW = Math.min(slot * 0.5, 40);
  const yOf = v => (h - padB) - (v / max) * (h - padB - padT);
  const targetY = yOf(DAILY_TARGET_KCAL);
  const dayNames = ['一', '二', '三', '四', '五', '六', '日'];

  let s = '';
  dates.forEach((d, i) => {
    const cx = slot * i + slot / 2;
    const v = vals[i];
    const bh = Math.max((v / max) * (h - padB - padT), v > 0 ? 1.5 : 0);
    const cls = v > DAILY_TARGET_KCAL ? 'wc-bar over' : 'wc-bar';
    s += `<rect class="${cls}" x="${(cx - barW / 2).toFixed(1)}" y="${(h - padB - bh).toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="4"></rect>`;
    const wd = dayNames[(parseDate(d).getDay() + 6) % 7];
    s += `<text class="wc-axis" x="${cx.toFixed(1)}" y="${h - 6}">${wd}</text>`;
    if (v > 0) {
      s += `<text class="wc-val" x="${cx.toFixed(1)}" y="${(h - padB - bh - 4).toFixed(1)}">${v}</text>`;
    }
  });
  s += `<line class="wc-target" x1="0" y1="${targetY.toFixed(1)}" x2="${w}" y2="${targetY.toFixed(1)}"></line>`;

  wrap.innerHTML =
    `<div class="wc-title">每日热量（kcal）· 虚线为目标 ${DAILY_TARGET_KCAL}</div>` +
    `<svg viewBox="0 0 ${w} ${h}">${s}</svg>`;
}

function mealCard(r) {
  const conf = r.confidence || 'low';
  const srcType = r.source_type || (r.asset_id && r.asset_id.startsWith('manual-') ? 'manual' : 'immich');
  const srcLabel = SOURCE_LABELS[srcType] || srcType;
  const isManual = srcType === 'manual';
  const time = fmtTimeHM(r.photo_time);
  const macros = (r.protein_g || r.carbs_g || r.fat_g) ? `
    <div class="macros">
      <span class="p">P ${r.protein_g||0}g</span>
      <span class="c">C ${r.carbs_g||0}g</span>
      <span class="f">F ${r.fat_g||0}g</span>
    </div>` : '';

  // Thumbnail — small size for card, preview size for lightbox
  let thumb = '';
  let clickClass = '';
  let clickAttr = '';
  if (!isManual) {
    let cardSrc = '';
    let lightboxSrc = '';
    if (r.replacement_image) {
      cardSrc = lightboxSrc = `${API}/api/local-image?path=${encodeURIComponent(r.replacement_image)}`;
    } else if (r.thumbnail_url) {
      lightboxSrc = `${API}/api/image?url=${encodeURIComponent(r.thumbnail_url)}`;
      cardSrc = `${API}/api/image?url=${encodeURIComponent(r.thumbnail_url.replace('/original', '/thumbnail?size=thumbnail'))}`;
    }
    if (cardSrc) {
      thumb = `<img class="card-thumb" src="${cardSrc}" onclick="event.stopPropagation();openLightboxForRecord('${esc(r.asset_id)}')" loading="lazy" onerror="retryImg(this)">`;
      clickClass = ' has-image';
      clickAttr = ` onclick="openLightboxForRecord('${esc(r.asset_id)}')" data-asset-id="${esc(r.asset_id)}" data-img-src="${esc(lightboxSrc)}" data-meal="${esc(r.meal)}" data-photo-time="${esc(r.photo_time||'')}" data-calories="${esc(String(r.calories||0))}" data-protein="${esc(String(r.protein_g||0))}" data-carbs="${esc(String(r.carbs_g||0))}" data-fat="${esc(String(r.fat_g||0))}" data-confidence="${esc(conf)}" data-source="${esc(srcType)}"`;
    }
  }

  return `
    <div class="meal-card${clickClass}"${clickAttr}>
      <div class="conf-indicator conf-${conf}" title="${CONF_TITLES[conf] || ''}"></div>
      ${thumb}
      <div class="body">
        <div class="meal-name">${esc(r.meal)}</div>
        <div class="meal-meta">${time} <span class="source">· ${srcLabel}</span></div>
        ${macros}
      </div>
      <div class="meal-right">
        <div class="meal-cals">${r.calories || 0}<small> kcal</small></div>
      </div>
    </div>
  `;
}

function fmtTimeHM(isoStr) {
  if (!isoStr) return '';
  return isoStr.slice(11, 16); // "HH:MM"
}

function fmtPhotoTimeDetail(isoStr) {
  if (!isoStr) return '';
  const s = isoStr.replace('T', ' ');
  const base = s.slice(0, 16);
  const tzMatch = isoStr.match(/([+-]\d{2}:\d{2})$/);
  if (tzMatch) {
    return base + ' ' + tzMatch[1];
  }
  return base;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function openLightboxForRecord(assetId) {
  const card = document.querySelector(`.meal-card[data-asset-id="${assetId}"]`);
  if (!card) return;

  currentLightboxAssetId = assetId;
  document.getElementById('lightbox-img').src = card.dataset.imgSrc;

  const d = card.dataset;
  const detailTime = fmtPhotoTimeDetail(d.photoTime);
  const confText = CONF_LABELS[d.confidence] || '';
  const srcLabel = SOURCE_LABELS[d.source] || d.source || '';
  const subParts = [detailTime, srcLabel, confText ? '置信度 ' + confText : ''].filter(Boolean);

  document.getElementById('lightbox-meta').innerHTML = `
    <div class="lb-meal">${esc(d.meal || '')}</div>
    <div class="lb-stats">
      <span class="lb-cal">${esc(d.calories || '0')}<small> kcal</small></span>
      <span class="p">P ${esc(d.protein || '0')}g</span>
      <span class="c">C ${esc(d.carbs || '0')}g</span>
      <span class="f">F ${esc(d.fat || '0')}g</span>
    </div>
    <div class="lb-sub">${esc(subParts.join(' · '))}</div>`;

  document.getElementById('lightbox-labels').style.display = 'flex';

  // Reset reanalysis UI + delete button
  document.getElementById('lightbox-reanalysis').classList.remove('active');
  document.getElementById('reanalysis-textarea').value = '';
  document.getElementById('reanalysis-error').textContent = '';
  disarmDelete();

  document.getElementById('lightbox').style.display = 'flex';
}

function toggleReanalysis() {
  const panel = document.getElementById('lightbox-reanalysis');
  const isActive = panel.classList.contains('active');
  if (isActive) {

function handleReanalysisKeydown(e) {
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    submitReanalysis();
  }
}

function submitReanalysis() {
  const notes = document.getElementById('reanalysis-textarea').value.trim();
  const assetId = currentLightboxAssetId;
  if (!notes || !assetId) return;

  const btn = document.getElementById('reanalysis-submit');
  const textarea = document.getElementById('reanalysis-textarea');
  const errorEl = document.getElementById('reanalysis-error');

  btn.disabled = true;
  textarea.disabled = true;
  errorEl.textContent = '';
  btn.innerHTML = '<span class="reanalysis-spinner"></span>分析中...';

  fetch(`${API}/api/reanalyze`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({asset_id: assetId, notes: notes})
  })
  .then(r => {
    if (!r.ok) {
      return r.json().then(data => {
        throw new Error(data.error || `HTTP ${r.status}`);
      });
    }
    return r.json();
  })
  .then(data => {
    if (data.ok && data.record) {
      // Refresh day view, then rebuild lightbox from updated card
      const ds = data.date || currentLoadedDate;
      cacheDel('day:' + ds);
      return fetch(`${API}/api/records?date=${ds}`)
        .then(r => r.json())
        .then(dayData => {
          cacheSet('day:' + ds, dayData);
          renderDay(dayData);
          openLightboxForRecord(assetId);
        });
    }
  })
  .catch(err => {
    errorEl.textContent = '失败: ' + (err.message || '请重试');
  })
  .finally(() => {
    btn.disabled = false;
    textarea.disabled = false;
    btn.textContent = '重新分析';
  });
}

let _deleteArmTimer = null;

function disarmDelete() {
  const btn = document.getElementById('lb-delete-btn');
  if (!btn) return;
  clearTimeout(_deleteArmTimer);
  btn.dataset.armed = '';
  btn.textContent = '删除';
  btn.classList.remove('armed');
}

function deleteRecord() {
  const assetId = currentLightboxAssetId;
  if (!assetId) return;

  const btn = document.getElementById('lb-delete-btn');
  if (!btn.dataset.armed) {
    // First click: arm for 3 seconds
    btn.dataset.armed = '1';
    btn.textContent = '确认删除？';
    btn.classList.add('armed');
    _deleteArmTimer = setTimeout(disarmDelete, 3000);
    return;
  }
  disarmDelete();

  fetch(`${API}/api/record`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ asset_id: assetId })
  })
  .then(r => {
    if (!r.ok) {
      return r.json().then(data => { throw new Error(data.error || `HTTP ${r.status}`); });
    }
    return r.json();
  })
  .then(data => {
    if (data.ok) {
      closeLightbox();
      const ds = data.date || currentLoadedDate;
      cacheDel('day:' + ds);
      cacheDel('dates');
      loadAvailableDates();
      loadDay(ds);
      toast('已删除，该照片不会再被同步');
    }
  })
  .catch(err => {
    toast('删除失败: ' + (err.message || '请重试'), 'error');
  });
}

function handleUpload(e) {
  const file = e.target.files[0];
  const assetId = currentLightboxAssetId;
  if (!file || !assetId) return;

  const form = new FormData();
  form.append('date', currentLoadedDate);
  form.append('asset_id', assetId);
  form.append('image', file);

  if (_abortController) _abortController.abort();
  _abortController = new AbortController();
  const replaceId = ++_fetchId;

  function _doReplace(signal) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => signal.abort(), 15000);
      fetch(`${API}/api/upload-image`, { method: 'POST', body: form, signal })
        .then(r => { clearTimeout(timer); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .then(resolve)
        .catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  _doReplace(_abortController.signal).then(data => {
    if (data.ok) {
      if (data.matched) {
        document.getElementById('lightbox-img').src = `${API}/api/image?url=${encodeURIComponent(data.thumbnail_url)}`;
      } else {
        document.getElementById('lightbox-img').src = `${API}/api/local-image?path=${encodeURIComponent(data.replacement_image)}`;
      }
      const ds = currentLoadedDate;
      fetch(`${API}/api/records?date=${ds}`)
        .then(r => r.json())
        .then(d => { cacheSet('day:' + ds, d); renderDay(d); });
    }
  }).catch(err => {
    if (err.name === 'AbortError' && replaceId === _fetchId) {
      const ctrl = new AbortController();
      _doReplace(ctrl.signal).then(data => {
        if (data.ok) {
          const ds = currentLoadedDate;
          fetch(`${API}/api/records?date=${ds}`)
            .then(r => r.json())
            .then(d => { cacheSet('day:' + ds, d); renderDay(d); });
        }
      }).catch(() => {});
    }
  });
  e.target.value = '';
}

function retryImg(img) {

  setTimeout(() => { img.src = img.src; }, 1000);

let _albumCursor = '';
let _albumLoading = false;
let _albumHasMore = true;
let _albumScrollHandler = null;

function triggerPhotoPicker() {
  const picker = document.getElementById('photo-picker');
  const content = document.getElementById('album-content');
  picker.style.display = 'flex';
  content.innerHTML = '<div class="spinner" style="margin:40px auto"></div>';

  _albumCursor = fmtDate(hktNow());
  _albumLoading = false;
  _albumHasMore = true;

  const scrollEl = document.getElementById('album-scroll');
  if (_albumScrollHandler) scrollEl.removeEventListener('scroll', _albumScrollHandler);
  _albumScrollHandler = function() {
    if (_albumLoading || !_albumHasMore) return;
    if (scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 50) {
      loadAlbumPage(_albumCursor, true);
    }
  };
  scrollEl.addEventListener('scroll', _albumScrollHandler);

  loadAlbumPage(_albumCursor, false);
}

function loadAlbumPage(cursor, append) {
  if (_albumLoading) return;
  _albumLoading = true;

  const content = document.getElementById('album-content');
  const loadingMore = document.getElementById('album-loading-more');
  if (!append) {
    content.innerHTML = '<div class="spinner" style="margin:40px auto"></div>';
  }
  loadingMore.style.display = 'flex';

  apiFetch(`/api/album-photos?cursor=${cursor}&days=7`)
    .then(data => {
      _albumLoading = false;
      loadingMore.style.display = 'none';

      if (!append) {
        content.innerHTML = '';
      }

      if (!data.dates || data.dates.length === 0) {
        if (!append) {
          content.innerHTML = '<div class="album-grid-empty">没有未处理的照片</div>';
        }
        _albumHasMore = false;
        return;
      }

      data.dates.forEach(day => {
        const group = document.createElement('div');
        group.className = 'album-date-group';

        const label = document.createElement('div');
        label.className = 'album-date-label';
        label.textContent = displayDate(day.date);
        group.appendChild(label);

        const grid = document.createElement('div');
        grid.className = 'album-grid';
        day.photos.forEach(photo => {
          const img = document.createElement('img');
          img.className = 'album-thumb';
          img.src = `${API}/api/image?url=${encodeURIComponent(photo.thumbnail_url)}`;
          img.alt = '';
          img.onclick = () => analyzeAlbumPhoto(photo, day.date);
          grid.appendChild(img);
        });
        group.appendChild(grid);

        content.appendChild(group);
      });

      _albumCursor = data.next_cursor;
      if (data.dates.length === 0) {
        _albumHasMore = false;
      }
    })
    .catch(err => {
      _albumLoading = false;
      loadingMore.style.display = 'none';
      if (!append) {
        content.innerHTML = `<div class="album-grid-empty">加载失败: ${err.message}</div>`;
      }
      _albumHasMore = false;
    });
}

async function analyzeAlbumPhoto(photo, dateStr) {
  closePhotoPicker();
  const overlay = document.getElementById('upload-overlay');
  const detail = document.getElementById('upload-detail');
  const btn = document.getElementById('upload-btn');

  overlay.style.display = 'flex';
  detail.textContent = '从相册获取...';
  btn.disabled = true;

  try {
    const response = await fetch(`${API}/api/analyze-album-photo`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        asset_id: photo.asset_id,
        source: photo.source,
        date: dateStr,
        thumbnail_url: photo.thumbnail_url,
        photo_time: photo.photo_time,
      }),
    });
    const data = await response.json();

    overlay.style.display = 'none';
    btn.disabled = false;

    if (data.ok) {
      cacheDel('day:' + data.date);
      cacheDel('dates');
      loadAvailableDates();
      _pendingLightboxAsset = data.record.asset_id;
      loadDay(data.date);
    } else if (data.error === 'not food') {
      toast('此图片不是真实食物，无法记录', 'error');
    } else if (data.error === 'already processed') {
      toast('此照片已在记录中', 'error');
    } else {
      toast('分析失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch (err) {
    overlay.style.display = 'none';
    btn.disabled = false;
    toast('分析失败: ' + err.message, 'error');
  }
}

let _pasteHandler = null;

function triggerManualUpload() {
  const picker = document.getElementById('upload-picker');
  picker.style.display = 'flex';

  // Global paste listener while picker is open
  if (_pasteHandler) document.removeEventListener('paste', _pasteHandler);
  _pasteHandler = function(ev) {
    const items = ev.clipboardData && ev.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        ev.preventDefault();
        const file = item.getAsFile();
        if (file) {
          closeUploadPicker();
          processUpload(file);
          return;
        }
      }
    }
  };
  document.addEventListener('paste', _pasteHandler);

  // Drag-and-drop on the drop zone
  const zone = document.getElementById('drop-zone');
  zone.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.stopPropagation();
    zone.classList.add('drag-over');
  });
  zone.addEventListener('dragleave', function(e) {
    e.preventDefault();
    e.stopPropagation();
    zone.classList.remove('drag-over');
  });
  zone.addEventListener('drop', function(e) {
    e.preventDefault();
    e.stopPropagation();
    zone.classList.remove('drag-over');
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files && files[0] && files[0].type.startsWith('image/')) {
      closeUploadPicker();
      processUpload(files[0]);
    }
  });
}

function closeUploadPicker() {
  document.getElementById('upload-picker').style.display = 'none';
  if (_pasteHandler) {
    document.removeEventListener('paste', _pasteHandler);
    _pasteHandler = null;
  }
}

function pickFromFile() {

}

let _pendingLightboxAsset = '';

async function processUpload(file) {
  // Try client-side EXIF first (instant, supports JPEG/PNG/WebP).
  const exifDate = await readExifDate(file);
  if (exifDate) {
    startUpload(file, exifDate);
    return;
  }

  // No EXIF client-side — let the server try (supports all formats via Pillow).
  // No date picker here; handled in handleResult if server also fails.
  startUpload(file, '');
}

function closeDatePicker() {

  window._pendingUploadFile = null;
}

function confirmDatePicker() {
  const file = window._pendingUploadFile;

  const date = document.getElementById('dp-input').value;

    startUpload(file, date);

function moveRecord(assetId, newDate) {

function startUpload(file, dateStr) {
  const overlay = document.getElementById('upload-overlay');
  const detail = document.getElementById('upload-detail');
  const btn = document.getElementById('upload-btn');

  overlay.style.display = 'flex';
  detail.textContent = file.name || '剪贴板图片';
  btn.disabled = true;

  const form = new FormData();
  form.append('image', file);

  let uploadUrl = `${API}/api/manual-upload`;
  if (dateStr) {
    form.append('date', dateStr);
    uploadUrl += `?date=${encodeURIComponent(dateStr)}`;
  }

  if (_abortController) _abortController.abort();
  _abortController = new AbortController();
  const uploadId = ++_fetchId;

  function _doUpload(signal) {
    const timer = setTimeout(() => signal.abort(), 60000);
    return fetch(uploadUrl, { method: 'POST', body: form, signal })
      .then(r => {
        clearTimeout(timer);
        if (!r.ok) {
          return r.json().then(data => {
            throw new Error(`HTTP ${r.status}: ${data.error || 'unknown'}`);
          }).catch(err => {
            if (err.message && err.message.startsWith('HTTP ')) throw err;
            throw new Error(`HTTP ${r.status}`);
          });
        }
        return r.json();
      });
  }

  function handleResult(data) {
    overlay.style.display = 'none';
    btn.disabled = false;
    if (data.ok) {
      cacheDel('day:' + data.date);
      cacheDel('dates');
      loadAvailableDates();
      _pendingLightboxAsset = data.record.asset_id;
      loadDay(data.date);
      if (data._date_source === 'fallback') {
        // Server couldn't extract EXIF either — saved to today. Offer correction.
        window._pendingUploadFile = null;
        window._lastUploadRecord = data.record;
        document.getElementById('dp-filename').textContent = data.record.meal || '上传记录';
        document.getElementById('dp-input').value = data.date;
        document.getElementById('date-picker').style.display = 'flex';
      }
    } else if (data.error === 'not food') {
      toast('此图片不是真实食物，无法记录', 'error');
    } else if (data.error === 'already processed') {
      toast('此照片已在记录中', 'error');
    } else {
      toast('上传失败: ' + (data.error || '未知错误'), 'error');
    }
  }

  _doUpload(_abortController.signal).then(handleResult).catch(err => {
    if (err.name === 'AbortError' && uploadId === _fetchId) {
      const ctrl = new AbortController();
      _doUpload(ctrl.signal).then(handleResult).catch(() => {
        overlay.style.display = 'none';
        btn.disabled = false;
        toast('上传超时，请检查网络连接后重试', 'error');
      });
      return;
    }
    overlay.style.display = 'none';
    btn.disabled = false;
    const msg = err.message || '';
    if (msg.startsWith('HTTP ')) {
      const parts = msg.split(': ');
      const status = parts[0].split(' ')[1];
      const serverMsg = parts.slice(1).join(': ');
      if (status === '413') toast('图片文件过大（超过 16MB），请压缩后重试', 'error');
      else if (status === '422') toast('此图片不是真实食物，无法记录', 'error');
      else if (status === '409') toast('此照片已在记录中', 'error');
      else if (status === '400') toast('上传失败: ' + (serverMsg || '参数或图片格式错误'), 'error');
      else toast('服务器错误 (' + status + '): ' + (serverMsg || '请重试'), 'error');
    } else {
      toast('上传失败，请检查网络连接', 'error');
    }
  });
}

function handleManualUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  processUpload(file);
  e.target.value = '';
}

function loadAvailableDates(force) {
  const cached = cacheGet('dates');

  // Under 5 minutes: use cache, skip network (unless force, e.g. data
  // version changed while the page was idle)
  if (!force && cached && cached.ts && (Date.now() - cached.ts < 300000)) {
    availableDates = new Set(cached.data);
    if (window.innerWidth >= 768) {
      calendarYear = currentDate.getFullYear();
      calendarMonth = currentDate.getMonth();
      renderCalendar(calendarYear, calendarMonth);
    }
    return;
  }

  // Stale but exists: render optimistically
  if (cached && cached.data) {
    availableDates = new Set(cached.data);
    if (window.innerWidth >= 768) {
      calendarYear = currentDate.getFullYear();
      calendarMonth = currentDate.getMonth();
      renderCalendar(calendarYear, calendarMonth);
    }
  }

  fetch(`${API}/api/dates`)
    .then(r => r.json())
    .then(dates => {
      cacheSet('dates', { data: dates, ts: Date.now() });
      availableDates = new Set(dates);
      if (window.innerWidth >= 768) {
        calendarYear = currentDate.getFullYear();
        calendarMonth = currentDate.getMonth();
        renderCalendar(calendarYear, calendarMonth);
      }
    })
    .catch(() => {});
}

// ── Background data-version polling ──────────────────────────
// Cron runs (agent or legacy path) write records server-side; an idle open
// page would never notice. Poll a cheap fingerprint every 30s and refresh
// the visible view + calendar dots when it changes.

let _lastDataVersion = null;

function refreshCurrentView() {
  if (viewMode === 'week' && currentWeekMonday) {
    loadWeek(currentWeekMonday);
  } else if (currentDate) {
    loadDay(fmtDate(currentDate));
  }
  loadAvailableDates(true);
}

function pollDataVersion() {
  if (document.visibilityState !== 'visible') return;
  apiFetch(`${API}/api/data-version`)
    .then(v => {
      if (!v || !v.version) return;
      if (_lastDataVersion === null) { _lastDataVersion = v.version; return; }
      if (v.version !== _lastDataVersion) {
        _lastDataVersion = v.version;
        refreshCurrentView();
      }
    })
    .catch(() => {});
}

setInterval(pollDataVersion, 30000);

// ── Keyboard navigation ───────────────────────────────────────

document.addEventListener('keydown', function(e) {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;

  const lightboxOpen = document.getElementById('lightbox').style.display === 'flex';

  if (e.key === 'Escape') {
    if (lightboxOpen) { closeLightbox(); return; }
    closeUploadPicker();
    closePhotoPicker();
    closeDatePicker();
    if (window.innerWidth < 768) {
      document.getElementById('calendar-dropdown').style.display = 'none';
    }
    return;
  }

  const modalOpen = lightboxOpen
    || document.getElementById('upload-picker').style.display === 'flex'
    || document.getElementById('photo-picker').style.display === 'flex'
    || document.getElementById('date-picker').style.display === 'flex';
  if (modalOpen) return;

  if (e.key === 'ArrowLeft') prevPeriod();
  if (e.key === 'ArrowRight') nextPeriod();
});

// Init: load today
loadAvailableDates();
loadDay('today');
if (window.innerWidth >= 768) {
  calendarYear = currentDate.getFullYear();
  calendarMonth = currentDate.getMonth();
  renderCalendar(calendarYear, calendarMonth);
}
</script>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkcal"
version = "0.2.0"
description = "Automatic food calorie tracker — Immich → SigLIP2 → Gemini → log"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.scripts]
inkcal = "main:main"
